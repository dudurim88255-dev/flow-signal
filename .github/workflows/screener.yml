name: screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0" # 매주 월요일 07:00 KST (= 일요일 22:00 UTC)

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run screener
        env:
          TZ: Asia/Seoul
        run: python screener/screener.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener/output
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore(screener): $(TZ=Asia/Seoul date +%Y-%m-%d) 결과 갱신"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
